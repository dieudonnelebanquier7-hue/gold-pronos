name: Validate GOLD PRONOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check auth.js
          node --check i18n.js
          node --check sw.js
      - name: Check required app files
        run: |
          test -s index.html
          test -s app.js
          test -s auth.js
          test -s styles.css
          test -s manifest.webmanifest
