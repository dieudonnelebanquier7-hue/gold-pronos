name: Deploy Gold Pronos with football data
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
concurrency:
  group: gold-pronos-pages
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Fetch fixtures from all available competitions
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          FROM_DATE=$(date -u -d '-7 days' +%F)
          TO_DATE=$(date -u -d '+7 days' +%F)
          mkdir -p data-fetch
          if [ -n "$FOOTBALL_DATA_TOKEN" ]; then
            CODE=$(curl --silent --show-error --output data-fetch/football-data.json --write-out "%{http_code}" --get "https://api.football-data.org/v4/matches" --data-urlencode "dateFrom=$FROM_DATE" --data-urlencode "dateTo=$TO_DATE" --header "X-Auth-Token: $FOOTBALL_DATA_TOKEN" || true)
            if [ "$CODE" != "200" ]; then echo "football-data.org indisponible (HTTP $CODE), ESPN prendra le relais."; fi
          fi
          node <<'NODE'
          const fs = require('fs');
          const from = new Date(); from.setUTCHours(0,0,0,0);
          const to = new Date(from); to.setUTCDate(to.getUTCDate()+7);
          const ymd = d => d.toISOString().slice(0,10).replace(/-/g,'');
          const dateRange = ymd(from)+'-'+ymd(to);
          const leagues = [
            ['eng.1','Premier League'],['eng.2','Championship'],['esp.1','La Liga'],['esp.2','Segunda División'],
            ['ger.1','Bundesliga'],['ita.1','Serie A'],['fra.1','Ligue 1'],['ned.1','Eredivisie'],['por.1','Primeira Liga'],
            ['tur.1','Süper Lig'],['nor.1','Eliteserien'],['swe.1','Allsvenskan'],['sui.1','Swiss Super League'],
            ['ksa.1','Saudi Pro League'],['cze.1','Czech First League'],['usa.1','MLS'],['rou.1','Liga I'],
            ['rus.1','Russian Premier League'],['chn.1','Chinese Super League'],['jpn.1','J1 League'],['bra.1','Brasileirão'],
            ['arg.1','Liga Profesional Argentina'],['mex.1','Liga MX'],['uefa.champions','Ligue des champions'],
            ['uefa.europa','Ligue Europa'],['uefa.europa.conf','Ligue Conférence'],['afc.champions','Ligue des champions AFC'],
            ['fifa.world','Compétitions FIFA']
          ];
          const sleep = ms => new Promise(r=>setTimeout(r,ms));
          async function fetchLeague([code,label]) {
            try {
              const url='https://site.api.espn.com/apis/site/v2/sports/soccer/'+code+'/scoreboard?dates='+dateRange;
              const response=await fetch(url,{signal:AbortSignal.timeout(12000),headers:{'User-Agent':'GOLD-PRONOS/0.3'}});
              if(!response.ok) { console.log('ESPN '+code+' indisponible : HTTP '+response.status); return []; }
              const data=await response.json();
              if(!(data.events||[]).length) console.log('ESPN '+code+' : aucun événement retourné pour '+dateRange);
              return (data.events||[]).map(event=>{
                const comp=event.competitions?.[0];
                const competitors=comp?.competitors||[];
                const home=competitors.find(t=>t.homeAway==='home')||competitors[0];
                const away=competitors.find(t=>t.homeAway==='away')||competitors[1];
                if(!home||!away) return null;
                const st=comp.status?.type||event.status?.type||{};
                const state=st.state;
                const status=st.completed?'FINISHED':state==='in'?'IN_PLAY':state==='post'?'FINISHED':'SCHEDULED';
                const homeScore=home.score==null?null:Number(home.score);
                const awayScore=away.score==null?null:Number(away.score);
                return {id:'espn-'+event.id,utcDate:event.date,status,competition:{name:event.league?.name||data.leagues?.[0]?.name||label,code:'ESPN-'+code},homeTeam:{name:home.team?.displayName||home.team?.name||'Équipe domicile'},awayTeam:{name:away.team?.displayName||away.team?.name||'Équipe extérieure'},score:{fullTime:{home:homeScore,away:awayScore}},matchday:null,source:'ESPN'};
              }).filter(Boolean);
            } catch(e) { console.log('Compétition ignorée '+code+': '+e.message); return []; }
          }
          (async()=>{
            let official=[];
            if(fs.existsSync('data-fetch/football-data.json')) {
              try { const d=JSON.parse(fs.readFileSync('data-fetch/football-data.json','utf8')); official=d.matches||[]; } catch(e) { console.log('Réponse football-data.org illisible'); }
            }
            const supplemental=[];
            for(let i=0;i<leagues.length;i+=5) {
              const batch=await Promise.all(leagues.slice(i,i+5).map(fetchLeague));
              supplemental.push(...batch.flat());
              await sleep(150);
            }
            const key=m=>[m.utcDate?.slice(0,16),m.homeTeam?.name?.toLowerCase(),m.awayTeam?.name?.toLowerCase()].join('|');
            const merged=new Map();
            for(const m of supplemental) merged.set(key(m),m);
            for(const m of official) merged.set(key(m),m);
            const matches=[...merged.values()].sort((a,b)=>new Date(a.utcDate)-new Date(b.utcDate));
            const result={generatedAt:new Date().toISOString(),sources:{footballData:official.length,espn:supplemental.length},matches};
            if(!matches.length) throw new Error('Aucun match reçu : arrêt du déploiement pour ne pas publier un calendrier vide.');
            fs.writeFileSync('matches.json',JSON.stringify(result));
            console.log('Calendrier consolidé : '+official.length+' football-data.org + '+supplemental.length+' ESPN = '+matches.length+' matchs uniques.');
            console.log('Contrôle qualité : '+matches.length+' matchs, JSON valide, collecte '+result.generatedAt);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
