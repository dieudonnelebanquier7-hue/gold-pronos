name: Deploy GOLD PRONOS
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'auth.js'
      - 'i18n.js'
      - 'styles.css'
      - 'sw.js'
      - 'fetch-matches.cjs'
      - 'fetch-news.cjs'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
    - cron: '0 23 * * *' # Génération quotidienne à 00:00 au Bénin (UTC+1)
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gold-pronos-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate verified football calendar
        run: node fetch-matches.cjs
      - name: Verify generated football calendar
        run: |
          node <<'NODE'
          const d = require('./matches.json');
          const rows = Array.isArray(d.matches) ? d.matches : [];
          if (rows.length < 100) throw new Error('Calendrier trop incomplet : ' + rows.length + ' rencontres. Publication annulée.');
          const ids = new Set();
          let invalid = 0;
          for (const m of rows) {
            const id = String(m.id || '');
            const date = Date.parse(m.utcDate || '');
            const home = String(m.homeTeam?.name || '').trim();
            const away = String(m.awayTeam?.name || '').trim();
            const status = String(m.status || '');
            if (!id || ids.has(id) || !Number.isFinite(date) || !home || !away ||
                /^Équipe (domicile|extérieure)$/i.test(home) || /^Équipe (domicile|extérieure)$/i.test(away) ||
                !['FINISHED', 'IN_PLAY', 'SCHEDULED'].includes(status)) invalid++;
            ids.add(id);
          }
          if (invalid > Math.max(3, Math.floor(rows.length * 0.01))) {
            throw new Error('Trop de rencontres mal formées : ' + invalid + '/' + rows.length + '. Publication annulée.');
          }
          console.log('Calendrier validé :', rows.length, 'rencontres ;', d.sources?.competitions, 'compétitions ;', invalid, 'anomalie(s).');
          NODE
      - name: Generate multi-source world football news
        run: node fetch-news.cjs
      - name: Verify generated news feed
        run: |
          node <<'NODE'
          const d = require('./news.json');
          const articles = Array.isArray(d.articles) ? d.articles : [];
          const healthyFeeds = Array.isArray(d.feeds) ? d.feeds.filter(x => x.ok).length : 0;
          if (d.articleCount !== articles.length || articles.length < 20 || healthyFeeds < 3) {
            throw new Error('Flux actualités trop faible : ' + articles.length + ' article(s), ' + healthyFeeds + ' source(s) actives. Publication annulée.');
          }
          if (articles.some(x => x.language !== 'fr' || !x.title?.trim() || !x.description?.trim())) {
            throw new Error('Le flux contient un article incomplet ou non déclaré en français. Publication annulée.');
          }
          console.log('Actualités validées :', articles.length, 'articles en français ;', healthyFeeds, 'sources actives.');
          NODE
      - name: Install browser verification tools
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          mkdir -p /tmp/gold-pronos-real-calendar
          cd /tmp/gold-pronos-real-calendar
          npm init -y
          npm install playwright
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Start application for browser verification
        run: python3 -m http.server 4173 --directory . >/tmp/gold-pronos-real-calendar-http.log 2>&1 &
      - name: Verify real generated matches appear on the home page
        env:
          NODE_PATH: /tmp/gold-pronos-real-calendar/node_modules
        run: node tests/real-calendar-smoke.cjs
      - name: Verify every page, match detail, predictions and mobile layout
        env:
          NODE_PATH: /tmp/gold-pronos-real-calendar/node_modules
        run: node tests/browser-smoke.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static application
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish application
        id: deployment
        uses: actions/deploy-pages@v4
