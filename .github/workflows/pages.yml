name: Deploy GOLD PRONOS
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'auth.js'
      - 'i18n.js'
      - 'styles.css'
      - 'sw.js'
      - 'fetch-matches.cjs'
      - 'fetch-news.cjs'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
    - cron: '0 23 * * *' # Génération quotidienne à 00:00 au Bénin (UTC+1)
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gold-pronos-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate verified football calendar
        run: node fetch-matches.cjs
      - name: Verify generated football calendar
        run: node -e "const d=require('./matches.json'); if(!Array.isArray(d.matches)||d.matches.length===0) throw new Error('Verified calendar is empty'); console.log('Verified calendar:', d.matches.length, 'matches across', d.sources?.competitions, 'competitions')"
      - name: Generate multi-source world football news
        run: node fetch-news.cjs
      - name: Verify generated news feed
        run: node -e "const d=require('./news.json'); if(!Array.isArray(d.articles)||!Array.isArray(d.feeds)||d.articleCount!==d.articles.length) throw new Error('Invalid news feed'); if(d.articles.some(x=>x.language!=='fr'||!x.title||!x.description)) throw new Error('News feed contains an incomplete or non-French article'); console.log('French football news:', d.articleCount, 'articles; healthy feeds:', d.feeds.filter(x=>x.ok).length)"
      - name: Install browser verification tools
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          mkdir -p /tmp/gold-pronos-real-calendar
          cd /tmp/gold-pronos-real-calendar
          npm init -y
          npm install playwright
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Start application for browser verification
        run: python3 -m http.server 4173 --directory . >/tmp/gold-pronos-real-calendar-http.log 2>&1 &
      - name: Verify real generated matches appear on the home page
        env:
          NODE_PATH: /tmp/gold-pronos-real-calendar/node_modules
        run: node tests/real-calendar-smoke.cjs
      - name: Verify every page, match detail, predictions and mobile layout
        env:
          NODE_PATH: /tmp/gold-pronos-real-calendar/node_modules
        run: node tests/browser-smoke.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static application
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish application
        id: deployment
        uses: actions/deploy-pages@v4
