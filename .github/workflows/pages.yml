name: Deploy GOLD PRONOS
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'national-teams.js'
      - 'auth.js'
      - 'i18n.js'
      - 'styles.css'
      - 'sw.js'
      - 'fetch-matches.cjs'
      - 'fetch-news.cjs'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'tests/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *' # Une collecte complète par jour à 00:00 au Bénin (UTC+1) ; le direct est actualisé dans l'application
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gold-pronos-pages
  cancel-in-progress: true
jobs:
  android:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/android-apk.yml
    permissions:
      contents: write
  deploy:
    needs: android
    if: ${{ always() && (needs.android.result == 'success' || needs.android.result == 'skipped') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download generated calendar and archive from Android build
        if: needs.android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: gold-pronos-generated-data
          path: .
      - name: Generate data for scheduled refresh without Android build
        if: needs.android.result == 'skipped'
        run: |
          node fetch-matches.cjs
          node fetch-news.cjs
      - name: Verify generated football calendar
        run: |
          node <<'NODE'
          const d = require('./matches.json');
          const rows = Array.isArray(d.matches) ? d.matches : [];
          const archive = require('./history.json');
          const historyRows = Array.isArray(archive.matches) ? archive.matches : [];
          const historySourceCounts = historyRows.reduce((counts, match) => {
            const source = String(match.source || 'unknown');
            counts[source] = (counts[source] || 0) + 1;
            return counts;
          }, {});
          console.log('Sources de l’archive :', JSON.stringify(historySourceCounts));
          const invalidHistory = historyRows.filter(m => {
            const date = Date.parse(m.utcDate || '');
            const home = Number(m.score?.fullTime?.home);
            const away = Number(m.score?.fullTime?.away);
            return m.status !== 'FINISHED' || m.scoreConflict === true || !['SportScore','ESPN','OpenLigaDB'].includes(m.source) ||
              !Number.isFinite(date) || date >= Date.now() || date < Date.now() - 366 * 86400000 ||
              !m.homeTeam?.name || !m.awayTeam?.name ||
              m.score?.fullTime?.home === null || m.score?.fullTime?.home === undefined ||
              m.score?.fullTime?.away === null || m.score?.fullTime?.away === undefined ||
              !Number.isInteger(home) || !Number.isInteger(away) || home < 0 || away < 0;
          });
          if (invalidHistory.length) throw new Error('Archive historique invalide : ' + invalidHistory.length + '/' + historyRows.length + ' résultat(s).');
          if (Number(d.sources?.historyRequests || 0) > 365) throw new Error('Collecte historique au-delà de la fenêtre autorisée.');
          if (Number(d.sources?.espnRequests || 0) + Number(d.sources?.historyScheduleRequests || 0) > 2000) throw new Error('Budget ESPN dépassé avec les historiques d’équipes.');
          console.log('Archive historique vérifiée :', historyRows.length, 'résultats terminés ;', archive.sources?.teamsWithFourHistory || 0, 'équipes avec 4+ résultats ;', archive.sources?.nationalTeamsWithFourHistory || 0, 'sélections avec 4+ résultats.');
          const generatedAt = Date.parse(d.generatedAt || '');
          if (!Number.isFinite(generatedAt) || Date.now() - generatedAt > 36 * 60 * 60 * 1000) throw new Error('Calendrier absent ou trop ancien.');
          const coverage = Array.isArray(d.sources?.competitionCoverage) ? d.sources.competitionCoverage : [];
          if (coverage.length !== Number(d.sources?.competitions || 0) || coverage.some(item => !item.code || !Number.isInteger(item.daysRequested) || item.daysRequested < 7)) {
            throw new Error('Rapport de couverture par compétition absent ou incomplet.');
          }
          if (Number(archive.sources?.espnNationalTeamsRequested || 0) > 100) throw new Error('Budget de récupération des sélections nationales dépassé.');
          console.log('Couverture compétition par compétition :', coverage.length, 'codes interrogés ;', coverage.filter(item => item.fixtures > 0).length, 'avec des rencontres confirmées.');
          const sources = d.sources || {};
          if (sources.espnRequests > 1500 || sources.sportscoreRequests > 50) throw new Error('Quota de collecte inattendu : vérifier les limites des sources.');
          if (Number(sources.espnDays || 0) < 7 || Number(sources.espnCompetitions || 0) < 30) throw new Error('Couverture ESPN trop étroite : collecte multi-jours ou compétitions mondiales absente.');
          if (!rows.length) throw new Error('Calendrier vide : aucune source n’a fourni de rencontre. Publication annulée.');
          const ids = new Set();
          const now = Date.now();
          let invalid = 0;
          let staleScheduled = 0;
          let futureFinished = 0;
          for (const m of rows) {
            const id = String(m.id || '');
            const date = Date.parse(m.utcDate || '');
            const home = String(m.homeTeam?.name || '').trim();
            const away = String(m.awayTeam?.name || '').trim();
            const status = String(m.status || '');
            if (!id || ids.has(id) || !Number.isFinite(date) || !home || !away ||
                /^Équipe (domicile|extérieure)$/i.test(home) || /^Équipe (domicile|extérieure)$/i.test(away) ||
                !['FINISHED', 'IN_PLAY', 'SCHEDULED'].includes(status)) invalid++;
            if (Number.isFinite(date) && status === 'SCHEDULED' && date < now - 6 * 60 * 60 * 1000) staleScheduled++;
            if (Number.isFinite(date) && status === 'FINISHED' && date > now + 6 * 60 * 60 * 1000) futureFinished++;
            ids.add(id);
          }
          if (invalid > Math.max(3, Math.floor(rows.length * 0.01))) {
            throw new Error('Trop de rencontres mal formées : ' + invalid + '/' + rows.length + '. Publication annulée.');
          }
          if (staleScheduled || futureFinished) {
            console.warn('Statuts à vérifier (aucune correction automatique) :', staleScheduled, 'rencontre(s) programmée(s) depuis plus de 6 h ;', futureFinished, 'rencontre(s) terminée(s) datée(s) à plus de 6 h dans le futur.');
          }
          console.log('Calendrier validé :', rows.length, 'rencontres ;', d.sources?.competitions, 'compétitions ;', invalid, 'anomalie(s) de structure ;', staleScheduled, 'statut(s) programmé(s) ancien(s) ;', futureFinished, 'statut(s) terminé(s) futur(s).');
          NODE
      - name: Verify generated news feed
        run: |
          node <<'NODE'
          const d = require('./news.json');
          const articles = Array.isArray(d.articles) ? d.articles : [];
          const healthyFeeds = Array.isArray(d.feeds) ? d.feeds.filter(x => x.ok).length : 0;
          if (d.articleCount !== articles.length || articles.length < 20 || healthyFeeds < 3) {
            throw new Error('Flux actualités trop faible : ' + articles.length + ' article(s), ' + healthyFeeds + ' source(s) actives. Publication annulée.');
          }
          if (articles.some(x => x.language !== 'fr' || !x.title?.trim() || !x.description?.trim())) {
            throw new Error('Le flux contient un article incomplet ou non déclaré en français. Publication annulée.');
          }
          console.log('Actualités validées :', articles.length, 'articles en français ;', healthyFeeds, 'sources actives.');
          NODE
      - name: Install browser verification tools
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          mkdir -p /tmp/gold-pronos-real-calendar
          cd /tmp/gold-pronos-real-calendar
          npm init -y
          npm install playwright
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Start application for browser verification
        run: python3 -m http.server 4173 --directory . >/tmp/gold-pronos-real-calendar-http.log 2>&1 &
      - name: Verify real generated matches appear on the home page
        env:
          NODE_PATH: /tmp/gold-pronos-real-calendar/node_modules
        run: node tests/real-calendar-smoke.cjs
      - name: Verify every page, match detail, predictions and mobile layout
        env:
          NODE_PATH: /tmp/gold-pronos-real-calendar/node_modules
        run: node tests/browser-smoke.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static application
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Publish application
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
