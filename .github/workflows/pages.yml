name: Deploy GOLD PRONOS
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'auth.js'
      - 'i18n.js'
      - 'styles.css'
      - 'sw.js'
      - 'fetch-matches.cjs'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
    - cron: '0 23 * * *' # Génération quotidienne à 00:00 au Bénin (UTC+1)
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gold-pronos-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate verified football calendar
        run: node fetch-matches.cjs
      - name: Verify generated football calendar
        run: node -e "const d=require('./matches.json'); if(!Array.isArray(d.matches)||d.matches.length===0) throw new Error('Verified calendar is empty'); console.log('Verified calendar:', d.matches.length, 'matches across', d.sources?.competitions, 'competitions')"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static application
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish application
        id: deployment
        uses: actions/deploy-pages@v4
