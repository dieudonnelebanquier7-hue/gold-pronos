name: Build GOLD PRONOS Android APK

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check national-teams.js

      - name: Fetch fixtures from all available competitions
        run: node fetch-matches.cjs
      - name: Verify generated fixtures JSON
        run: |
          node -e "const fs=require('fs'),d=JSON.parse(fs.readFileSync('matches.json','utf8')),h=JSON.parse(fs.readFileSync('history.json','utf8')); if(!Array.isArray(d.matches)||!d.matches.length||!Array.isArray(h.matches)) process.exit(1); console.log(d.matches.length+' fixtures and '+h.matches.length+' historical results validated');"
      - name: Generate French football news for Android
        run: |
          node fetch-news.cjs
          node <<'NODE'
          const d = require('./news.json');
          const articles = Array.isArray(d.articles) ? d.articles : [];
          const healthy = Array.isArray(d.feeds) ? d.feeds.filter(x => x.ok).length : 0;
          if (articles.length < 20 || healthy < 3 || articles.some(x => x.language !== 'fr' || !x.title || !x.description)) {
            throw new Error('Flux français Android incomplet : ' + articles.length + ' articles, ' + healthy + ' sources actives.');
          }
          console.log('Flux Android validé :', articles.length, 'articles en français.');
          NODE
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Prepare Capacitor Android project
        run: |
          mkdir -p www
          cp index.html app.js auth.js styles.css i18n.js sw.js national-teams.js manifest.webmanifest icon.svg matches.json history.json news.json www/
          test -s www/auth.js
          test -s www/national-teams.js
          test -s www/history.json
          node --check www/auth.js
          node --check www/national-teams.js
          node --check www/app.js
          cat > package.json <<'EOF'
          {
            "name": "gold-pronos-android",
            "version": "0.2.0",
            "private": true,
            "description": "GOLD PRONOS - Le Banquier",
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/android": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.lebanquier.goldpronos",
            "appName": "GOLD PRONOS",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npm install
          npx cap add android
          npx cap sync android
          # Capacitor peut réécrire les propriétés pendant sync : appliquer le délai après cette étape.
          sed -i '/^networkTimeout=/d; /^distributionUrl=/a networkTimeout=60000' android/gradle/wrapper/gradle-wrapper.properties
          grep -E '^(distributionUrl|networkTimeout)=' android/gradle/wrapper/gradle-wrapper.properties

      - name: Add Maven Central fallback and retry settings
        run: |
          cat > /tmp/gold-pronos-gradle.init.gradle <<'EOF'
          allprojects {
            buildscript {
              repositories {
                maven { url 'https://repo1.maven.org/maven2' }
              }
            }
            repositories {
              maven { url 'https://repo1.maven.org/maven2' }
            }
          }
          EOF

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Build Android APK · tentative $attempt/3"
            if ./gradlew --init-script /tmp/gold-pronos-gradle.init.gradle --refresh-dependencies assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Dépendances Maven momentanément indisponibles ; nouvelle tentative dans 20 secondes."
              sleep 20
            fi
          done
          exit 1

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Install and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.lebanquier.goldpronos 1
            sleep 10
            test -n "$(adb shell pidof com.lebanquier.goldpronos)"
            adb logcat -d -s AndroidRuntime:E > /tmp/android-runtime.log
            if grep -q 'FATAL EXCEPTION' /tmp/android-runtime.log; then echo "Crash détecté au lancement Android."; cat /tmp/android-runtime.log; exit 1; fi
            adb shell dumpsys activity activities | grep -q 'com.lebanquier.goldpronos'
            echo "Installation et lancement Android confirmés."
      - name: Publish APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v0.2-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" android/app/build/outputs/apk/debug/app-debug.apk             --title "GOLD PRONOS Android v0.2 - Build ${GITHUB_RUN_NUMBER}"             --notes "APK Android de GOLD PRONOS - Le Banquier. Installation manuelle Android. Cette version embarque le calendrier disponible au moment de la compilation et les analyses statistiques 1N2, double chance, buts et BTTS calculées à partir des résultats vérifiés disponibles. Les probabilités sont indicatives ; aucune cote ni absence de joueur n'est inventée."
