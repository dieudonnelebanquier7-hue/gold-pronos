name: Build GOLD PRONOS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'manifest.webmanifest'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Fetch fixtures from all available competitions
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          PAST_FROM=$(date -u -d '-6 days' +%F)
          TODAY=$(date -u +%F)
          FUTURE_TO=$(date -u -d '+6 days' +%F)
          mkdir -p data-fetch
          if [ -n "$FOOTBALL_DATA_TOKEN" ]; then
            PAST_CODE=$(curl --silent --show-error --output data-fetch/football-data-past.json --write-out "%{http_code}" --get "https://api.football-data.org/v4/matches" --data-urlencode "dateFrom=$PAST_FROM" --data-urlencode "dateTo=$TODAY" --header "X-Auth-Token: $FOOTBALL_DATA_TOKEN" || true)
            FUTURE_CODE=$(curl --silent --show-error --output data-fetch/football-data-future.json --write-out "%{http_code}" --get "https://api.football-data.org/v4/matches" --data-urlencode "dateFrom=$TODAY" --data-urlencode "dateTo=$FUTURE_TO" --header "X-Auth-Token: $FOOTBALL_DATA_TOKEN" || true)
            if [ "$PAST_CODE" != "200" ]; then echo "football-data.org période passée indisponible (HTTP $PAST_CODE)."; fi
            if [ "$FUTURE_CODE" != "200" ]; then echo "football-data.org période future indisponible (HTTP $FUTURE_CODE)."; fi
          fi
          node <<'NODE'
          const fs = require('fs');
          const today = new Date(); today.setUTCHours(0,0,0,0);
          const pastFrom = new Date(today); pastFrom.setUTCDate(pastFrom.getUTCDate()-6);
          const futureTo = new Date(today); futureTo.setUTCDate(futureTo.getUTCDate()+6);
          const ymd = d => d.toISOString().slice(0,10).replace(/-/g,'');
          const dateRanges = [ymd(pastFrom)+'-'+ymd(today), ymd(today)+'-'+ymd(futureTo)];
          const leagues = [
            ['eng.1','Premier League'],['eng.2','Championship'],['esp.1','La Liga'],['esp.2','Segunda División'],
            ['ger.1','Bundesliga'],['ita.1','Serie A'],['fra.1','Ligue 1'],['ned.1','Eredivisie'],['por.1','Primeira Liga'],
            ['tur.1','Süper Lig'],['nor.1','Eliteserien'],['swe.1','Allsvenskan'],['sui.1','Swiss Super League'],
            ['ksa.1','Saudi Pro League'],['cze.1','Czech First League'],['usa.1','MLS'],['rou.1','Liga I'],
            ['rus.1','Russian Premier League'],['chn.1','Chinese Super League'],['jpn.1','J1 League'],['bra.1','Brasileirão'],
            ['arg.1','Liga Profesional Argentina'],['mex.1','Liga MX'],['uefa.champions','Ligue des champions'],
            ['uefa.europa','Ligue Europa'],['uefa.europa.conf','Ligue Conférence'],['afc.champions','Ligue des champions AFC'],
            ['fifa.world','Compétitions FIFA']
          ];
          const sleep = ms => new Promise(r=>setTimeout(r,ms));
          async function fetchLeague([code,label], dateRange) {
            try {
              const url='https://site.api.espn.com/apis/site/v2/sports/soccer/'+code+'/scoreboard?dates='+dateRange;
              const response=await fetch(url,{signal:AbortSignal.timeout(12000),headers:{'User-Agent':'GOLD-PRONOS/0.3'}});
              if(!response.ok) { console.log('ESPN '+code+' indisponible : HTTP '+response.status); return []; }
              const data=await response.json();
              if(!(data.events||[]).length) console.log('ESPN '+code+' : aucun événement retourné pour '+dateRange);
              return (data.events||[]).map(event=>{
                const comp=event.competitions?.[0];
                const competitors=comp?.competitors||[];
                const home=competitors.find(t=>t.homeAway==='home')||competitors[0];
                const away=competitors.find(t=>t.homeAway==='away')||competitors[1];
                if(!home||!away) return null;
                const st=comp.status?.type||event.status?.type||{};
                const state=st.state;
                const status=st.completed?'FINISHED':state==='in'?'IN_PLAY':state==='post'?'FINISHED':'SCHEDULED';
                const homeScore=home.score==null?null:Number(home.score);
                const awayScore=away.score==null?null:Number(away.score);
                return {id:'espn-'+event.id,utcDate:event.date,status,competition:{name:event.league?.name||data.leagues?.[0]?.name||label,code:'ESPN-'+code},homeTeam:{name:home.team?.displayName||home.team?.name||'Équipe domicile'},awayTeam:{name:away.team?.displayName||away.team?.name||'Équipe extérieure'},score:{fullTime:{home:homeScore,away:awayScore}},matchday:null,source:'ESPN'};
              }).filter(Boolean);
            } catch(e) { console.log('Compétition ignorée '+code+': '+e.message); return []; }
          }
          (async()=>{
            let official=[];
            for (const file of ['data-fetch/football-data-past.json','data-fetch/football-data-future.json']) {
              if(fs.existsSync(file)) {
                try { const d=JSON.parse(fs.readFileSync(file,'utf8')); official.push(...(d.matches||[])); }
                catch(e) { console.log('Réponse football-data.org illisible dans '+file); }
              }
            }
            const supplemental=[];
            for (const dateRange of dateRanges) {
              for(let i=0;i<leagues.length;i+=5) {
                const batch=await Promise.all(leagues.slice(i,i+5).map(league=>fetchLeague(league,dateRange)));
                supplemental.push(...batch.flat());
                await sleep(150);
              }
            }
            const key=m=>[m.utcDate?.slice(0,16),m.homeTeam?.name?.toLowerCase(),m.awayTeam?.name?.toLowerCase()].join('|');
            const merged=new Map();
            for(const m of supplemental) merged.set(key(m),m);
            for(const m of official) merged.set(key(m),m);
            const matches=[...merged.values()].sort((a,b)=>new Date(a.utcDate)-new Date(b.utcDate));
            const result={generatedAt:new Date().toISOString(),sources:{footballData:official.length,espn:supplemental.length},matches};
            if(!matches.length) throw new Error('Aucun match reçu : arrêt du déploiement pour ne pas publier un calendrier vide.');
            fs.writeFileSync('matches.json',JSON.stringify(result));
            console.log('Calendrier consolidé : '+official.length+' football-data.org + '+supplemental.length+' ESPN = '+matches.length+' matchs uniques.');
            console.log('Contrôle qualité : '+matches.length+' matchs, JSON valide, collecte '+result.generatedAt);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify generated fixtures JSON
        run: |
          node -e "const d=JSON.parse(require('fs').readFileSync('matches.json','utf8')); if(!Array.isArray(d.matches)||!d.matches.length) process.exit(1); console.log(d.matches.length+' fixtures validated');"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Prepare Capacitor Android project
        run: |
          mkdir -p www
          cp index.html app.js styles.css manifest.webmanifest icon.svg matches.json www/
          cat > package.json <<'EOF'
          {
            "name": "gold-pronos-android",
            "version": "0.2.0",
            "private": true,
            "description": "GOLD PRONOS - Le Banquier",
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/android": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.lebanquier.goldpronos",
            "appName": "GOLD PRONOS",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npm install
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v0.2-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" android/app/build/outputs/apk/debug/app-debug.apk             --title "GOLD PRONOS Android v0.2 - Build ${GITHUB_RUN_NUMBER}"             --notes "APK Android de GOLD PRONOS - Le Banquier. Installation manuelle Android. Cette version embarque le calendrier disponible au moment de la compilation. Les analyses avancées et cotes ne sont pas incluses tant qu'elles ne sont pas réellement implémentées et alimentées par une source fiable."
